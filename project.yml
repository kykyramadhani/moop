name: moop
options:
  bundleIdPrefix: com.rizkyinsania
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: JLQK39AS23
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  Lottie:
    url: https://github.com/airbnb/lottie-ios
    from: "4.5.0"
  # backup and restore read and write plain zip files. the platform can only
  # write them, so this is the one dependency the feature needs.
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.19"

targets:
  moop:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Support/Assets.xcassets
      - path: Support/Fonts
        buildPhase: resources
      - path: Support/Motion
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rizkyinsania.moop
        PRODUCT_NAME: moop
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Support/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Support/moop.entitlements
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: Lottie
      - package: ZIPFoundation
      - sdk: CloudKit.framework
      - sdk: AuthenticationServices.framework
      - sdk: FoundationModels.framework
      - sdk: AVFoundation.framework
